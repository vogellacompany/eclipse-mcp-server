name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# two runs must not race the gh-pages publish; a newer pending run replaces an older one
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean verify

      # The directory is named after what was actually built, qualifier included,
      # so a rebuild of the same version never lands on an existing URL.
      - name: Determine the built version
        id: version
        run: |
          repository=update-site/com.vogella.eclipse.mcp.repository/target/repository
          jar=$(find "$repository/features" -name 'com.vogella.eclipse.mcp.feature_*.jar' | head -1)
          if [ -z "$jar" ]; then
            echo "No feature jar below $repository/features" >&2
            exit 1
          fi
          value=$(basename "$jar" .jar)
          echo "value=${value#com.vogella.eclipse.mcp.feature_}" >> "$GITHUB_OUTPUT"

      - name: Check out the update site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Add the build to the update site
        run: |
          version="${{ steps.version.outputs.value }}"
          rm -rf "gh-pages/releases/$version"
          mkdir -p "gh-pages/releases/$version"
          cp -r update-site/com.vogella.eclipse.mcp.repository/target/repository/. "gh-pages/releases/$version"
          # the site carries this build only; everything else is dropped.
          # --only rather than --keep 1, because a qualifier-named directory does
          # not sort above a plainly named one: 0.2.1 beats 0.2.0.202608201136.
          releng/update-composite-site.sh --only "$version" gh-pages

      # one orphan commit replaces the branch, so its history never accumulates
      # the copies of builds the site has already dropped
      - name: Publish the update site
        working-directory: gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan publish
          git add -A
          git commit -m "Publish ${{ steps.version.outputs.value }}"
          git push --force origin HEAD:gh-pages

      - name: Attach the repository archive to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(find update-site/com.vogella.eclipse.mcp.repository/target -maxdepth 1 -name '*.zip' | head -1)
          # the built name carries the Maven -SNAPSHOT suffix, which is misleading on a release
          archive="com.vogella.eclipse.mcp.repository-${GITHUB_REF_NAME#v}.zip"
          cp "$built" "$archive"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
